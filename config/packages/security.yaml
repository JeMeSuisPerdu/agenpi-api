security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        # Autorise la page d'accueil de l'API (la doc Swagger)
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        
        # On autorise tout le monde à tenter de se connecter
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        
        # Seul un utilisateur avec le rôle ADMIN peut créer un nouvel employé
        - { path: ^/api/users, roles: ROLE_ADMIN, methods: [POST] }

        # Tout le reste de l'API demande d'être connecté
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10